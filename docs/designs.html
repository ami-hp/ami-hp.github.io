<!doctype html><html lang="en" xmlns:x-on="http://www.w3.org/1999/xhtml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1"><meta http-equiv="X-UA-Compatible" content="ie=edge"><title>AMI :: Designs</title><script defer="defer" src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script><script defer="defer" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><script defer="defer" src="designs.2cb1c058d0027f363e2b.js"></script><link href="vendors.95bc0821c8ed955e7c68.css" rel="stylesheet"></head><body class="font-serif bg-gunmetal-500 text-amber-50 designs"><section class="container mx-auto mt-20 py-10 px-10 relative w-full" x-data="{showClass: ''}"><div class="title-section"><h2 class="h-star">Designs</h2></div><div class="mx-auto mt-40 px-4 sm:px-6 lg:max-w-7xl lg:px-8"><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10" x-data="{
