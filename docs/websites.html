<!doctype html>
<html lang="en" xmlns:x-on="http://www.w3.org/1999/xhtml" xmlns:x-bind="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>I am AMI :: Websites</title>
    <link rel="icon" type="image/x-icon" href="/assets/ami-logo-CIQm9Mwm.svg"/>


  <script type="module" crossorigin src="/assets/websites-RL3llQMg.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/module.esm-CnbGxzRy.js">
  <link rel="stylesheet" crossorigin href="/assets/module-895ixdP1.css">
</head>

<body class="font-serif bg-gunmetal-500 text-amber-50 websites" x-data>

<section class="container mx-auto mt-20 py-10 px-10 relative w-full">
    <div class="title-section">
        <h2 class="h-star">Websites</h2>
    </div>
    <div class="mx-auto mt-40 px-4 sm:px-6 lg:max-w-7xl lg:px-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10"
             x-data="{}">
            <template x-for="image in $store.page.websites.images">
                <div>
                    <a :href="image.href" target="_blank" class="block group">
                        <div class="relative block transition-all bg-gunmetal-700 bg-pattern wave rounded-3xl group-hover:rounded-none shadow-2xl">
                            <div class="absolute z-[1] w-full h-full transition-all group-hover:bg-gunmetal-500/75 overflow-hidden">
                                <ul class="flex flex-wrap h-full justify-center items-center">
                                    <template x-for="skill in $store.page.websites.skills">
                                        <li class="transition-all aspect-square rounded-full bg-white p-2 me-2 shadow group-hover:opacity-0"
                                            x-show="image.skills[skill]">
                                            <div class="w-[20px] aspect-square skill-img" :class="skill"></div>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                            <div class="absolute z-[2] w-1/5 h-1/5 transition-all left-0 top-0     group-hover:left-5 group-hover:top-5     border-l border-t border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                            <div class="absolute z-[2] w-1/5 h-1/5 transition-all left-0 bottom-0  group-hover:left-5 group-hover:bottom-5  border-l border-b border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                            <div class="absolute z-[2] w-1/5 h-1/5 transition-all right-0 top-0    group-hover:right-5 group-hover:top-5    border-r border-t border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                            <div class="absolute z-[2] w-1/5 h-1/5 transition-all right-0 bottom-0 group-hover:right-5 group-hover:bottom-5 border-r border-b border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                            <div class="absolute z-[2] w-full h-full transition-all opacity-0 group-hover:opacity-100 text-white text-3xl flex items-center justify-center">
                                Preview
                            </div>

                            <div class="w-full aspect-[16/9] rounded-2xl group-hover:rounded-none shadow-2xl transition-all transform scale-x-75 scale-y-[70%] group-hover:scale-100 work-img"
                                 :class="image.class"
                            ></div>

                        </div>
                    </a>
                    <div class="p-2 font-sans text-center">
                        <span class="text-lg" x-text="image.title"></span> <a class="text-red-500!" x-show="image.github.length > 1" x-bind:href="image.github">(github)</a>
                    </div>

                </div>

            </template>
        </div>
    </div>

</section>
<section class="container mx-auto mt-20 py-10 px-10  relative w-full">
    <div class="title-section">
        <h2 class="h-star">Packages</h2>
    </div>
    <div class="mx-auto mt-40 px-4 sm:px-6 lg:max-w-7xl lg:px-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10"
             x-data="{}">
            <template x-for="image in $store.page.packages.images">
                <a :href="image.href" target="_blank" class="group">
                    <div class="relative block aspect-[16/9] transition-all bg-gunmetal-700 bg-pattern wave rounded-3xl group-hover:rounded-none shadow-2xl">
                        <div class="absolute z-[1] w-full h-full transition-all group-hover:bg-gunmetal-500/75 overflow-hidden">
                            <ul class="flex flex-wrap h-full justify-center items-center">
                                <template x-for="skill in $store.page.packages.skills">
                                    <li x-show="image.skills[skill]"
                                        class="transition-all aspect-square rounded-full bg-white p-2 me-2 shadow group-hover:opacity-0">
                                        <div class="w-[20px] aspect-square skill-img" :class="skill"></div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                        <div class="absolute z-[2] w-1/5 h-1/5 transition-all left-0 top-0     group-hover:left-5 group-hover:top-5     border-l border-t border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                        <div class="absolute z-[2] w-1/5 h-1/5 transition-all left-0 bottom-0  group-hover:left-5 group-hover:bottom-5  border-l border-b border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                        <div class="absolute z-[2] w-1/5 h-1/5 transition-all right-0 top-0    group-hover:right-5 group-hover:top-5    border-r border-t border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                        <div class="absolute z-[2] w-1/5 h-1/5 transition-all right-0 bottom-0 group-hover:right-5 group-hover:bottom-5 border-r border-b border-solid border-lion-300/0 group-hover:border-lion-300 pointer-events-none"></div>
                        <div class="absolute z-[2] w-full h-full transition-all opacity-0 group-hover:opacity-100 text-white text-3xl flex items-center justify-center">
                            Preview
                        </div>

                        <div class="w-full aspect-[16/9] rounded-2xl group-hover:rounded-none shadow-2xl transition-all transform scale-x-75 scale-y-[70%] group-hover:scale-100 work-img"
                             :class="image.class"
                        ></div>

                    </div>
                    <div class="p-2 font-sans text-center">
                        <span class="text-lg" x-text="image.title"></span>
                    </div>
                </a>

            </template>
        </div>
    </div>
</section>

</body>

</html>
